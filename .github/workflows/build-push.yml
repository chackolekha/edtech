# Active pipeline — builds backend + frontend images and pushes to Docker Hub.
#
# Repo secrets required:
#   DOCKERHUB_USERNAME   Docker Hub user (also the namespace for the repos)
#   DOCKERHUB_TOKEN      Docker Hub access token (Account Settings → Security)
# NEXT_PUBLIC_API_URL is set in the build-args below (demo EC2 IP).
#
# Docker Hub repos (public, free tier):
#   <DOCKERHUB_USERNAME>/edtech-backend   and   <DOCKERHUB_USERNAME>/edtech-frontend
#
# Optional auto-deploy over SSH (Lightsail/EC2 running compose.prod.yml):
#   vars.DEPLOY_HOST     e.g. ubuntu@1.2.3.4 — job skipped when unset
#   secrets.DEPLOY_SSH_KEY  private key for that user
#   vars.DEPLOY_DIR      repo checkout on the host (default ~/edtech)

name: Build & push (Docker Hub)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read   # checkout only — Docker Hub auth comes from secrets

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/edtech-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/edtech-frontend

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          # NEXT_PUBLIC_API_URL is inlined into the bundle at build time.
          # Demo: raw EC2 IP — update here (or to https://api.<domain>/api/v1) when you get a domain.
          build-args: |
            NEXT_PUBLIC_API_URL=http://13.210.240.61:8000/api/v1
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: images
    if: ${{ vars.DEPLOY_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (compose pull + up)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_DIR || '~/edtech' }}
            git pull --ff-only
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d
            docker image prune -f
