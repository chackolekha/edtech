name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edtech
          POSTGRES_PASSWORD: edtech
          POSTGRES_DB: edtech
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edtech" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://edtech:edtech@localhost:5432/edtech
      JWT_SECRET: ci-secret
      DEV_MODE: "true"
      STORAGE_DIR: /tmp/edtech-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        working-directory: backend
        run: pip install -r requirements-dev.txt "psycopg[binary]"
      - name: Migrations
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Tests
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npx eslint src
      - name: Build
        working-directory: frontend
        run: npm run build
