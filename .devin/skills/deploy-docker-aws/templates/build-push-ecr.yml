# BACKUP pipeline — pushes images to AWS ECR instead of Docker Hub.
# Manual trigger only (Actions → "Build & push to ECR (backup)").
# The active pipeline is build-push.yml (Docker Hub).
#
# Requires repo secrets: AWS_ROLE_ARN, <PUBLIC_API_VAR>
# Requires an OIDC provider + IAM role — no stored AWS keys.

name: Build & push to ECR (backup)

on:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC — no stored AWS keys
  contents: read

env:
  AWS_REGION: <region>                # e.g. ap-south-1
  ECR_BACKEND: <APP>-backend
  ECR_FRONTEND: <APP>-frontend

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build & push backend
        run: |
          REG=${{ steps.ecr.outputs.registry }}
          docker build -t $REG/$ECR_BACKEND:${{ github.sha }} \
                       -t $REG/$ECR_BACKEND:latest backend/
          docker push $REG/$ECR_BACKEND --all-tags

      - name: Build & push frontend
        run: |
          REG=${{ steps.ecr.outputs.registry }}
          docker build \
            --build-arg <PUBLIC_API_VAR>=${{ secrets.<PUBLIC_API_VAR> }} \
            -t $REG/$ECR_FRONTEND:${{ github.sha }} \
            -t $REG/$ECR_FRONTEND:latest frontend/
          docker push $REG/$ECR_FRONTEND --all-tags
