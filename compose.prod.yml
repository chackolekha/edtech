# Production compose — pulls pre-built images from ECR.
# Postgres is external (Neon); STORAGE_DIR uses a named volume on the host.
#
# Required on the host: a .env file next to this file with
#   DATABASE_URL, JWT_SECRET, CORS_ORIGINS  (see .env.example)
# and ECR registry/repo in the image tags below (or build locally instead —
# swap each `image:` for `build: ./backend` / `build: ./frontend`).

services:
  backend:
    image: ${ECR_REGISTRY:-localhost}/edtech-backend:${IMAGE_TAG:-latest}
    # build: ./backend
    restart: unless-stopped
    environment:
      # Neon: postgresql+psycopg://user:pw@<endpoint>-pooler.<region>.aws.neon.tech/<db>?sslmode=require
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      STORAGE_DIR: /data/storage
      DEV_MODE: "false"
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ${ECR_REGISTRY:-localhost}/edtech-frontend:${IMAGE_TAG:-latest}
    # build:
    #   context: ./frontend
    #   args:
    #     NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}   # inlined at build time
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  storage:
