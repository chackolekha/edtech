services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edtech
      POSTGRES_PASSWORD: edtech
      POSTGRES_DB: edtech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edtech"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
